name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-worker:
    name: Python worker (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # Heavy native deps (pywhispercpp, audonnx, onnxruntime) are imported
        # lazily with graceful fallbacks, so the suite only needs these.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pydantic click numpy openai anthropic
      - name: Run tests
        run: pytest

  web:
    name: Web UI (build, vitest & Playwright smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      # The smoke serves the build above through a fake app (web/e2e/fixture-server.ts).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  macos-app:
    name: macOS app (swift build & test)
    # Hummingbird 2.29 (local server) declares swift-tools-version 6.2, which needs Xcode 26.
    # macos-26 images ship Xcode 26.1.1 (Swift 6.2.1), the toolchain used for local development.
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos-app
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.1.1
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
